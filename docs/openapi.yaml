openapi: 3.0.3
info:
  title: Monity Finance Tracker API
  description: Backend API for the finance tracker frontend. All dates/times are ISO 8601 / RFC3339. Authenticated endpoints require Bearer JWT.
  version: 1.0.0

servers:
  - url: /api/v1
    description: API v1 base path (prepend your host, e.g. https://api.example.com)

security:
  - bearerAuth: []

tags:
  - name: auth
    description: Registration, login, refresh, me, logout
  - name: activities
    description: Activity feed
  - name: assets
    description: Assets CRUD and price history
  - name: incomes
    description: Income entries
  - name: expenses
    description: Expense entries
  - name: categories
    description: Per-user income and expense categories
  - name: saving-goals
    description: Saving goals
  - name: debts
    description: Debts (hutang) and payments
  - name: receivables
    description: Receivables (piutang) and payments
  - name: portfolio
    description: Portfolio and asset values (supports currency)
  - name: performance
    description: Asset and portfolio performance (supports currency)
  - name: insights
    description: Cashflow and financial overview
  - name: prices
    description: External crypto/stock prices and charts (public, optional auth)

paths:
  # --- Auth (no auth required for register, login, refresh) ---
  /auth/register:
    post:
      tags: [auth]
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessAuthData' }
        '400':
          description: Invalid or missing fields
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Email already registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/login:
    post:
      tags: [auth]
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessAuthData' }
        '400':
          description: Bad request
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/refresh:
    post:
      tags: [auth]
      summary: Refresh access token
      description: |
        Returns a new access and refresh token. The refresh token is rotated: the one sent stops
        working 30 seconds after its first use, so store the new one. Revoked refresh tokens and
        tokens issued before the last password change are rejected.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string, description: JWT refresh token }
      responses:
        '200':
          description: New tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessAuthData' }
        '400':
          description: Bad request
        '401':
          description: Unauthorized or invalid refresh token

  /auth/me:
    get:
      tags: [auth]
      summary: Get current user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessEnvelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
        '401':
          description: Unauthorized

  /auth/logout:
    post:
      tags: [auth]
      summary: Logout (invalidate tokens)
      description: |
        Revokes the access token from the optional `Authorization: Bearer` header and the refresh
        token from the body; revoked refresh tokens are rejected by `/auth/refresh`. No valid session
        is needed, so a client whose access token has expired can still revoke its refresh token.
        At least one of the two tokens must be sent.
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: Logged out
        '400':
          description: Neither an access token nor a refresh token was sent

  /auth/password:
    put:
      tags: [auth]
      summary: Change password
      description: |
        Verifies the current password and stores the new one. Every access and refresh token issued
        before the change stops working, which signs out all other sessions; the response carries a
        new token pair for the caller. Limited to 5 requests per 15 minutes per client.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 8, maxLength: 72, description: At least one letter and one digit }
      responses:
        '200':
          description: Password changed; new tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessAuthData' }
        '400':
          description: Current password is incorrect, new password is too weak, or it equals the current one
        '401':
          description: Unauthorized
        '429':
          description: Too many attempts

  # --- Activities ---
  /activities:
    get:
      tags: [activities]
      summary: List activities (income/expense feed)
      parameters:
        - name: group_by
          in: query
          schema: { type: string, enum: [day, week, month] }
        - name: date
          in: query
          schema: { type: string, format: date }
        - name: tz
          in: query
          schema: { type: string, description: IANA timezone }
      responses:
        '200':
          description: Grouped activities
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessEnvelope' }
                  - type: object
                    properties:
                      data: { type: object, description: Grouped activities }
        '401':
          description: Unauthorized

  # --- Assets ---
  /assets:
    get:
      tags: [assets]
      summary: List assets (paginated)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated list of assets
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessEnvelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ListResponseAsset' }
        '401':
          description: Unauthorized
    post:
      tags: [assets]
      summary: Create asset
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAssetRequest' }
      responses:
        '201':
          description: Asset created
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessEnvelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Asset' }
        '400':
          description: Bad request
        '401':
          description: Unauthorized

  /assets/{uuid}:
    get:
      tags: [assets]
      summary: Get asset by UUID
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      responses:
        '200':
          description: Asset by UUID
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessEnvelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Asset' }
        '401':
          description: Unauthorized
        '404':
          description: Not found
    put:
      tags: [assets]
      summary: Update asset
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAssetRequest' }
      responses:
        '200':
          description: Asset updated
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessEnvelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Asset' }
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Not found
    delete:
      tags: [assets]
      summary: Delete asset
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      responses:
        '200':
          description: Success
        '401':
          description: Unauthorized
        '404':
          description: Not found

  /assets/{uuid}/prices:
    get:
      tags: [assets]
      summary: Get price history for asset
      parameters:
        - $ref: '#/components/parameters/UuidPath'
        - name: limit
          in: query
          schema: { type: integer, default: 100 }
      responses:
        '200':
          description: Price history
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessEnvelope' }
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/AssetPriceHistory' } }
        '401':
          description: Unauthorized
        '404':
          description: Not found
    post:
      tags: [assets]
      summary: Record a price manually
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                price: { type: number }
                source: { type: string }
                recordedAt: { type: string, format: date-time }
      responses:
        '201':
          description: Price recorded
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Not found
  /assets/{uuid}/prices/fetch:
    post:
      tags: [assets]
      summary: Fetch and record current price from external source
      description: >
        Records the current market price per unit of a crypto or stock asset, in the asset's
        purchase currency. Nothing is recorded when the price source is unreachable (only a stale
        price is known) or the price cannot be converted to the purchase currency.
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      responses:
        '201':
          description: Price fetched and recorded
        '400':
          description: Not a crypto or stock asset, no symbol, or symbol unknown at the price source
        '401':
          description: Unauthorized
        '404':
          description: Asset not found
        '503':
          description: Current price unavailable; nothing recorded

  # --- Incomes ---
  /incomes:
    get:
      tags: [incomes]
      summary: List incomes (paginated, filterable, sortable)
      description: |
        All filters are optional and combine with AND. Malformed values (bad date, non-UUID category,
        non-numeric amount, unknown sort), date_from after date_to, min_amount above max_amount,
        more than 50 categories or a search longer than 100 characters return 400.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/Month'
        - $ref: '#/components/parameters/Year'
        - $ref: '#/components/parameters/CategoryFilter'
        - $ref: '#/components/parameters/AssetFilter'
        - $ref: '#/components/parameters/IncomeSearch'
        - $ref: '#/components/parameters/MinAmount'
        - $ref: '#/components/parameters/MaxAmount'
        - $ref: '#/components/parameters/TransactionSort'
      responses:
        '200':
          description: Paginated list of incomes
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessEnvelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ListResponseIncome' }
        '400':
          description: Invalid filter or sort
        '401':
          description: Unauthorized
    post:
      tags: [incomes]
      summary: Create income
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateIncomeRequest' }
      description: |
        Adds the amount to the CASH asset atomically.
      responses:
        '201':
          description: Income created
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessEnvelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Income' }
        '400':
          description: Bad request
        '401':
          description: Unauthorized

  /incomes/summary:
    get:
      tags: [incomes]
      summary: Totals for the incomes matching a filter
      description: |
        Takes the same filters as `GET /incomes` (paging and sort are ignored) and returns the total,
        count and average, a per-category breakdown (largest first) and a day or month series.
      parameters:
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/Month'
        - $ref: '#/components/parameters/Year'
        - $ref: '#/components/parameters/CategoryFilter'
        - $ref: '#/components/parameters/AssetFilter'
        - $ref: '#/components/parameters/IncomeSearch'
        - $ref: '#/components/parameters/MinAmount'
        - $ref: '#/components/parameters/MaxAmount'
        - $ref: '#/components/parameters/SummaryGroupBy'
      responses:
        '200':
          description: Summary of the matching incomes
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessEnvelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TransactionSummary' }
        '400':
          description: Invalid filter or group_by
        '401':
          description: Unauthorized

  /incomes/{uuid}:
    get:
      tags: [incomes]
      summary: Get income by UUID
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      responses:
        '200':
          description: Income by UUID
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessEnvelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Income' }
        '401':
          description: Unauthorized
        '404':
          description: Not found
    put:
      tags: [incomes]
      summary: Update income
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      description: |
        Partial update. Changing the amount or the asset moves the difference between cash assets
        atomically; returns 400 when that would make a balance negative.
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateIncomeRequest' }
      responses:
        '200':
          description: Income updated
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessEnvelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Income' }
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Not found
    delete:
      tags: [incomes]
      summary: Delete income
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      responses:
        '200':
          description: Success
        '401':
          description: Unauthorized
        '404':
          description: Not found

  # --- Expenses ---
  /expenses:
    get:
      tags: [expenses]
      summary: List expenses (paginated, filterable, sortable)
      description: |
        All filters are optional and combine with AND. Malformed values (bad date, non-UUID category,
        non-numeric amount, unknown sort), date_from after date_to, min_amount above max_amount,
        more than 50 categories or a search longer than 100 characters return 400.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/Month'
        - $ref: '#/components/parameters/Year'
        - $ref: '#/components/parameters/CategoryFilter'
        - $ref: '#/components/parameters/AssetFilter'
        - $ref: '#/components/parameters/ExpenseSearch'
        - $ref: '#/components/parameters/MinAmount'
        - $ref: '#/components/parameters/MaxAmount'
        - $ref: '#/components/parameters/TransactionSort'
      responses:
        '200':
          description: Paginated list of expenses
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessEnvelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ListResponseExpense' }
        '400':
          description: Invalid filter or sort
        '401':
          description: Unauthorized
    post:
      tags: [expenses]
      summary: Create expense
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateExpenseRequest' }
      description: |
        Takes the amount from the CASH asset atomically. Returns 400 when the asset balance is too low.
      responses:
        '201':
          description: Expense created
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessEnvelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Expense' }
        '400':
          description: Bad request
        '401':
          description: Unauthorized

  /expenses/summary:
    get:
      tags: [expenses]
      summary: Totals for the expenses matching a filter
      description: |
        Takes the same filters as `GET /expenses` (paging and sort are ignored) and returns the total,
        count and average, a per-category breakdown (largest first) and a day or month series.
      parameters:
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/Month'
        - $ref: '#/components/parameters/Year'
        - $ref: '#/components/parameters/CategoryFilter'
        - $ref: '#/components/parameters/AssetFilter'
        - $ref: '#/components/parameters/ExpenseSearch'
        - $ref: '#/components/parameters/MinAmount'
        - $ref: '#/components/parameters/MaxAmount'
        - $ref: '#/components/parameters/SummaryGroupBy'
      responses:
        '200':
          description: Summary of the matching expenses
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessEnvelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TransactionSummary' }
        '400':
          description: Invalid filter or group_by
        '401':
          description: Unauthorized

  /expenses/{uuid}:
    get:
      tags: [expenses]
      summary: Get expense by UUID
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      responses:
        '200':
          description: Expense by UUID
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessEnvelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Expense' }
        '401':
          description: Unauthorized
        '404':
          description: Not found
    put:
      tags: [expenses]
      summary: Update expense
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      description: |
        Partial update. Changing the amount or the asset moves the difference between cash assets
        atomically; returns 400 when that would make a balance negative.
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateExpenseRequest' }
      responses:
        '200':
          description: Expense updated
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessEnvelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Expense' }
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Not found
    delete:
      tags: [expenses]
      summary: Delete expense
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      responses:
        '200':
          description: Success
        '401':
          description: Unauthorized
        '404':
          description: Not found

  # --- Categories ---
  /categories:
    get:
      tags: [categories]
      summary: List the user's categories
      description: New users get default categories (see Category). Sorted by type, then name.
      parameters:
        - name: type
          in: query
          schema: { type: string, enum: [INCOME, EXPENSE] }
          description: Only categories of this type (case-insensitive)
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessEnvelope' }
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Category' } }
        '400':
          description: Invalid type
        '401':
          description: Unauthorized
    post:
      tags: [categories]
      summary: Create category
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCategoryRequest' }
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessEnvelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Category' }
        '400':
          description: Validation error, or a category with this name (case-insensitive) already exists for this type
        '401':
          description: Unauthorized

  /categories/{uuid}:
    get:
      tags: [categories]
      summary: Get category by UUID
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      responses:
        '200':
          description: Category
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessEnvelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Category' }
        '400':
          description: Invalid UUID
        '401':
          description: Unauthorized
        '404':
          description: Not found
    put:
      tags: [categories]
      summary: Update category (rename, recolor, change icon)
      description: The type cannot be changed. Existing incomes/expenses show the new name immediately.
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCategoryRequest' }
      responses:
        '200':
          description: Category updated
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessEnvelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Category' }
        '400':
          description: Validation error or duplicate name
        '401':
          description: Unauthorized
        '404':
          description: Not found
    delete:
      tags: [categories]
      summary: Delete category
      description: |
        A category that is still used by incomes/expenses can only be deleted with `reassign_to`:
        those transactions are moved to that category in the same database transaction.
      parameters:
        - $ref: '#/components/parameters/UuidPath'
        - name: reassign_to
          in: query
          schema: { type: string, format: uuid }
          description: Category of the same type that receives this category's transactions. Required when it is in use.
      responses:
        '200':
          description: Category deleted
        '400':
          description: Category in use without reassign_to, or reassign_to is invalid (not found, same category, other type)
        '401':
          description: Unauthorized
        '404':
          description: Not found

  # --- Saving goals ---
  /saving-goals:
    get:
      tags: [saving-goals]
      summary: List saving goals (paginated)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated list of saving goals
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessEnvelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ListResponseSavingGoal' }
        '401':
          description: Unauthorized
    post:
      tags: [saving-goals]
      summary: Create saving goal
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSavingGoalRequest' }
      responses:
        '201':
          description: Saving goal created
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessEnvelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SavingGoal' }
        '400':
          description: Bad request
        '401':
          description: Unauthorized

  /saving-goals/{uuid}:
    get:
      tags: [saving-goals]
      summary: Get saving goal by UUID
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      responses:
        '200':
          description: Saving goal by UUID
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessEnvelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SavingGoal' }
        '401':
          description: Unauthorized
        '404':
          description: Not found
    put:
      tags: [saving-goals]
      summary: Update saving goal
      parameters:
