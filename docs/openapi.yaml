  # --- Prices (external; optional auth) ---
  /prices/search:
    get:
      tags: [prices]
      summary: Search stock or crypto symbols (asset form symbol picker)
      parameters:
        - name: type
          in: query
          required: true
          schema: { type: string, enum: [STOCK, CRYPTO] }
        - name: q
          in: query
          schema: { type: string, maxLength: 50, example: bbca }
      security: []
      responses:
        '200':
          description: Matching symbols (at most 10)
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessEnvelope' }
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/SymbolSearchResult' }
        '400':
          description: Invalid type or q too long
        '502':
          description: Upstream search failed

  /prices/crypto/{symbol}:
    get:
      tags: [prices]
      summary: Get current crypto price
      parameters:
        - name: symbol
          in: path
          required: true
          schema: { type: string, example: BTC }
        - $ref: '#/components/parameters/Currency'
      security: []
      responses:
        '200':
          description: Current crypto price
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessEnvelope' }
                  - type: object
                    properties:
                      data: { type: object }
        '400':
          description: Bad request
        '404':
          description: Symbol not found

  /prices/stock/{symbol}:
    get:
      tags: [prices]
      summary: Get current stock price
      parameters:
        - name: symbol
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/Currency'
      security: []
      responses:
        '200':
          description: Current stock price
        '400':
          description: Bad request
        '404':
          description: Symbol not found

  /prices/crypto/{symbol}/chart:
    get:
      tags: [prices]
      summary: Get crypto chart data
      parameters:
        - name: symbol
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/Currency'
        - name: days
          in: query
          description: Days of history (default 7). At most 500 points are returned.
          schema: { type: integer, enum: [1, 7, 14, 30, 90, 180, 365], default: 7 }
      security: []
      responses:
        '200':
          description: >
            Crypto chart time series in the requested currency. When CoinGecko cannot be reached,
            the last chart fetched (up to 30 days old) is returned with stale=true.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessEnvelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PriceChart' }
        '400':
          description: Bad request
        '404':
          description: Symbol not found

  /prices/stock/{symbol}/chart:
    get:
      tags: [prices]
      summary: Get stock chart data
      description: >
        Prices are in the listing's own currency (IDR for BBCA.JK, USD for AAPL), given in the
        response's currency field; there is no currency parameter. Daily ranges up to 1y are cut
        from one cached 1y chart.
      parameters:
        - name: symbol
          in: path
          required: true
          schema: { type: string, example: BBCA.JK }
        - name: range
          in: query
          schema: { type: string, enum: [1d, 5d, 1mo, 3mo, 6mo, 1y, 2y, 5y, 10y, ytd, max], default: 1mo }
        - name: interval
          in: query
          description: >
            Intraday intervals (5m, 15m, 30m, 1h) are only allowed with range 1d or 5d. Use 1wk or
            1mo for ranges beyond 1y.
          schema: { type: string, enum: [5m, 15m, 30m, 1h, 1d, 1wk, 1mo], default: 1d }
      security: []
      responses:
        '200':
          description: >
            Stock chart time series. When Yahoo cannot be reached, the last chart fetched (up to
            30 days old) is returned with stale=true.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessEnvelope' }
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PriceChart' }
        '400':
          description: Bad request
        '404':
          description: Symbol not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from login or refresh

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
      description: Page number (1-based)
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      description: Items per page
    UuidPath:
      name: uuid
      in: path
      required: true
      schema: { type: string, format: uuid }
    DateFrom:
      name: date_from
      in: query
      schema: { type: string, format: date, example: "2025-02-01" }
      description: Start date (YYYY-MM-DD, UTC), inclusive. Can be used without date_to. Takes precedence over month/year.
    DateTo:
      name: date_to
      in: query
      schema: { type: string, format: date, example: "2025-02-28" }
      description: End date (YYYY-MM-DD, UTC), inclusive (the whole day). Can be used without date_from. Takes precedence over month/year.
    Month:
      name: month
      in: query
      schema: { type: string, example: "2025-02" }
      description: Whole month (YYYY-MM). Used only when date_from/date_to are not set.
    Year:
      name: year
      in: query
      schema: { type: string, example: "2025" }
      description: Whole year (YYYY). Used only when date_from/date_to and month are not set.
    CategoryFilter:
      name: category
      in: query
      schema: { type: string, example: "3f1c…,9a2b…" }
      description: Comma-separated category UUIDs; matches any of them.
    AssetFilter:
      name: asset
      in: query
      schema: { type: string, format: uuid }
      description: Only transactions of this CASH asset.
    IncomeSearch:
      name: q
      in: query
      schema: { type: string }
      description: Case-insensitive search in source and note.
    ExpenseSearch:
      name: q
      in: query
      schema: { type: string }
      description: Case-insensitive search in note.
    MinAmount:
      name: min_amount
      in: query
      schema: { type: string, example: "10000" }
      description: Minimum amount, inclusive (decimal).
    MaxAmount:
      name: max_amount
      in: query
      schema: { type: string, example: "500000.50" }
      description: Maximum amount, inclusive (decimal).
    TransactionSort:
      name: sort
      in: query
      schema: { type: string, enum: [-date, date, -amount, amount], default: -date }
      description: Sort field; a leading `-` sorts descending. Equal amounts are ordered newest first.
    SummaryGroupBy:
      name: group_by
      in: query
      schema: { type: string, enum: [day, month], default: day }
      description: Period size of the summary series.
    Currency:
      name: currency
      in: query
      schema: { type: string, default: IDR, example: IDR }
      description: Display currency (e.g. IDR, USD). Used by portfolio, performance, price endpoints.

  schemas:
    PriceChart:
      type: object
      properties:
        symbol: { type: string, example: BBCA.JK }
        currency: { type: string, example: IDR }
        data:
          type: array
          items:
            type: object
            properties:
              t: { type: integer, format: int64, description: Unix seconds }
              p: { type: number, description: Price }
        previousClose:
          type: number
          description: Close of the previous session; only on stock charts with range 1d.
        stale:
          type: boolean
          description: The price source was unreachable; this is the last chart fetched earlier.
    SuccessEnvelope:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean, example: true }
        message: { type: string }
        data: { description: Response payload; omit on error }

    ErrorResponse:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean, example: false }
        message: { type: string }
        errors:
          type: object
          description: Always an object; use message key for generic message or field keys for validation
          additionalProperties: true
          example: { message: "invalid email or password" }

    ListMeta:
      type: object
      properties:
        total: { type: integer, description: Total count of items }
        page: { type: integer }
        limit: { type: integer }
        totalPages: { type: integer }

    ListResponseAsset:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Asset' } }
        meta: { $ref: '#/components/schemas/ListMeta' }

    ListResponseIncome:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Income' } }
        meta: { $ref: '#/components/schemas/ListMeta' }

    ListResponseExpense:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Expense' } }
        meta: { $ref: '#/components/schemas/ListMeta' }

    ListResponseSavingGoal:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/SavingGoal' } }
        meta: { $ref: '#/components/schemas/ListMeta' }

    RegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1 }
        name: { type: string }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    User:
      type: object
      properties:
        uuid: { type: string, format: uuid }
        email: { type: string }
        name: { type: string, nullable: true }
        role: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SuccessAuthData:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                token: { type: string, description: Access JWT }
                refreshToken: { type: string, description: Refresh JWT }
                user: { $ref: '#/components/schemas/User' }

    Money:
      description: |
        Positive amount with at most 2 decimals and less than 1e18. Requests accept a JSON number or a
        decimal string; responses always use a decimal string to keep precision.
      oneOf:
        - { type: string, example: "125000.50" }
        - { type: number, example: 125000.5 }

    CreateIncomeRequest:
      type: object
      required: [assetUuid, amount, source, date]
      properties:
        assetUuid: { type: string, format: uuid, description: CASH asset that receives the money }
        amount: { $ref: '#/components/schemas/Money' }
        source: { type: string, maxLength: 200 }
        categoryUuid: { type: string, format: uuid, description: INCOME category; defaults to the user's "Other" category }
        note: { type: string, nullable: true, maxLength: 500 }
        date: { type: string, format: date-time }

    UpdateIncomeRequest:
      type: object
      description: Every field is optional; omitted fields keep their value.
      properties:
        assetUuid: { type: string, format: uuid }
        amount: { $ref: '#/components/schemas/Money' }
        source: { type: string, maxLength: 200 }
        categoryUuid: { type: string, format: uuid }
        note: { type: string, nullable: true, maxLength: 500 }
        date: { type: string, format: date-time }

    Income:
      type: object
      properties:
        uuid: { type: string, format: uuid }
        amount: { type: string, example: "1500000", description: Decimal string }
        source: { type: string }
        categoryUuid: { type: string, format: uuid }
        category: { type: string, example: Salary, description: Category name }
        note: { type: string, nullable: true }
        date: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        assetUuid: { type: string, format: uuid }
        assetName: { type: string, example: Bank }

    CreateExpenseRequest:
      type: object
      required: [assetUuid, amount, date]
      description: Send `categoryUuid`. The legacy `category` (category name such as `FOOD` or `Food`, case-insensitive) is still accepted when `categoryUuid` is omitted.
      properties:
        assetUuid: { type: string, format: uuid, description: CASH asset the money is taken from }
        amount: { $ref: '#/components/schemas/Money' }
        categoryUuid: { type: string, format: uuid, description: EXPENSE category }
        category: { type: string, deprecated: true, description: Legacy category name }
        note: { type: string, nullable: true, maxLength: 500 }
        date: { type: string, format: date-time }

    UpdateExpenseRequest:
      type: object
      description: Every field is optional; omitted fields keep their value.
      properties:
        assetUuid: { type: string, format: uuid }
        amount: { $ref: '#/components/schemas/Money' }
        categoryUuid: { type: string, format: uuid }
        category: { type: string, deprecated: true, description: Legacy category name }
        note: { type: string, nullable: true, maxLength: 500 }
        date: { type: string, format: date-time }

    Expense:
      type: object
      properties:
        uuid: { type: string, format: uuid }
        amount: { type: string, example: "45000", description: Decimal string }
        categoryUuid: { type: string, format: uuid }
        category: { type: string, example: Food, description: Category name }
        note: { type: string, nullable: true }
        date: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        assetUuid: { type: string, format: uuid }
        assetName: { type: string, example: Dompet }

    Category:
      type: object
      description: |
        Per-user category. New users get these defaults —
        EXPENSE: Food, Transport, Housing, Utilities, Health, Entertainment, Shopping, Other;
        INCOME: Salary, Bonus, Business, Investment, Gift, Other.
        Names are unique per user and type, ignoring case.
      properties:
        uuid: { type: string, format: uuid }
        type: { type: string, enum: [INCOME, EXPENSE] }
        name: { type: string, example: Food }
        color: { type: string, nullable: true, example: "#22C55E" }
        icon: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateCategoryRequest:
      type: object
      required: [type, name]
      properties:
        type: { type: string, enum: [INCOME, EXPENSE], description: Case-insensitive }
        name: { type: string, maxLength: 50 }
        color: { type: string, nullable: true, pattern: '^#[0-9A-Fa-f]{6}$', example: "#22C55E" }
        icon: { type: string, nullable: true, maxLength: 50 }

    UpdateCategoryRequest:
      type: object
      description: Every field is optional; omitted fields keep their value.
      properties:
        name: { type: string, maxLength: 50 }
        color: { type: string, nullable: true, pattern: '^#[0-9A-Fa-f]{6}$' }
        icon: { type: string, nullable: true, maxLength: 50 }

    TransactionSummary:
      type: object
      properties:
        total: { type: string, example: "1250000", description: Decimal string }
        count: { type: integer }
        average: { type: string, example: "62500", description: "Decimal string, rounded to 2 decimals" }
        byCategory:
          type: array
          description: Largest total first
          items: { $ref: '#/components/schemas/CategoryTotal' }
        groupBy: { type: string, enum: [day, month] }
        series:
          type: array
          description: Oldest period first; periods without transactions are omitted
          items: { $ref: '#/components/schemas/PeriodTotal' }

    PeriodTotal:
      type: object
      properties:
        period: { type: string, example: "2025-02-14", description: YYYY-MM-DD (day) or YYYY-MM (month) }
        total: { type: string, description: Decimal string }
        count: { type: integer }

